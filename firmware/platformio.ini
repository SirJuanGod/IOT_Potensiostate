; Potenciostato LMP91000 + AD5662 + ADS1115 (ESP32-C3)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_upload.flash_size = 2MB
monitor_speed = 115200

; Tests en el host: solo libs puras (sin ESP-IDF)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -Werror -lm
lib_ignore = model_hook
